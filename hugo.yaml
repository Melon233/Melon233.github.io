# ============================================================
#  Hugo 站点配置
# ============================================================

baseURL: "https://Melon233.github.io/"
languageCode: "zh-cn"
title: "Chino 的技术笔记"
theme: "PaperMod"

# 让 URL 保持干净的 /posts/xxx/ 形式
permalinks:
  posts: "/posts/:slug/"

# 首页显示最近的 N 篇
pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# ---------- 压缩输出，让 Pages 加载更快 ----------
minify:
  disableXML: true
  minifyOutput: true

# ---------- 版权（页脚）----------
# copyright 留空即可：页脚模板会按「建站年–当前年」自动生成
#   建站当年（同年） → “© 2026 Chino. All rights reserved.”
#   之后每一年       → “© 2026–2027 Chino. All rights reserved.”
# 跨年无需手改。若想完全自定义文案，直接填写 copyright，模板会优先使用它。
copyright: ""

params:
  env: production

  # ---------- 建站年份 ----------
  # 本站首次发布的年份。版权年份区间 = startYear–当前年份。
  # 起始年与当前年相同时只显示一个年份。
  startYear: 2026

  title: "Chino 的技术笔记"
  description: "记录学习过程中的踩坑与总结"
  keywords: [Blog, 技术笔记, 编程]
  author: "Chino"

  # ---------- GitHub 用户名 ----------
  # 首页头像直接引用 GitHub 头像，换头像时博客自动跟随。
  githubUser: "Melon233"

  # ---------- 页脚 ----------
  footer:
    hideCopyright: false

  # ---------- 主题 ----------
  # 固定暗色，并移除右上角的切换按钮与左侧站点标题链接。
  defaultTheme: dark
  disableThemeToggle: true
  # 隐藏 header 里的站点标题文字，让左上角保持干净
  hideHeaderTitle: true

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false

  # ---------- 首页改为自定义布局 ----------
  # homeInfoParams 留空：不再显示「你好，我是 Chino」那段文案。
  # 首页内容由 layouts/home.html 接管。

  # ---------- 文章目录设置 ----------
  assets:
    disableHLJS: true      # 用 Hugo 内置高亮，不额外加载 highlight.js
    favicon: "/favicon.ico"

  # ---------- 本地搜索（PaperMod 内置，基于 JSON 索引）----------
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# ---------- 顶部菜单 ----------
# 首页改为自定义布局后，导航由 home.html 自行渲染，这里只保留搜索页入口。
menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10

# ---------- 生成搜索索引 ----------
outputs:
  home:
    - HTML
    - RSS
    - JSON      # 搜索功能依赖这个

taxonomies:
  tag: tags
  category: categories
